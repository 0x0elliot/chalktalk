<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chalktalk</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    </style>
  </head>
  <body>
    <script>
      const { invoke } = window.__TAURI__.core;
      window.__sketchTab = "screen";
      window.__chalktalkScreen = {
        capture: (area) => invoke("capture", { area: area || null }).catch(() => null),
        done: () => invoke("done"),
      };

      let hit = null;
      window.__chalktalkHit = (x, y) => {
        const el = document.elementFromPoint(x, y);
        const now = Boolean(el) && el !== document.documentElement && el !== document.body;
        if (now === hit) return;
        hit = now;
        invoke("set_hit", { hit: now });
      };

      window.__chalktalkStart = () => {
        hit = null;
        fetch("http://127.0.0.1:47321/point.js")
          .then((r) => {
            if (!r.ok) throw new Error(String(r.status));
            return r.text();
          })
          .then((code) => (0, eval)(code))
          .catch(() => {
            const box = document.createElement("div");
            box.style.cssText =
              "position:fixed;top:24px;left:50%;transform:translateX(-50%);padding:12px 18px;border-radius:14px;background:#2c2c2a;color:#fff;font:14px system-ui,sans-serif;box-shadow:0 8px 24px #0004";
            const hotkey = /Mac/.test(navigator.platform) ? "⌃⌥C" : "Ctrl+Alt+C";
            box.textContent = `Chalktalk isn't running. Paste /chalktalk listen into a Claude Code session, then press ${hotkey} again.`;
            document.body.append(box);
            setTimeout(() => window.__chalktalkScreen.done(), 5000);
          });
      };
    </script>
  </body>
</html>
